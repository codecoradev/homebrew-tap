name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    name: brew audit (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update Homebrew
        run: brew update

      - name: Tap this repository
        run: brew tap codecoradev/tap "${{ github.workspace }}"

      - name: Style check
        run: brew style codecoradev/tap/uteke

      - name: Audit formula
        run: brew audit --strict --formula codecoradev/tap/uteke

  test-macos:
    name: brew install + test (macOS ARM)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update Homebrew
        run: brew update

      - name: Tap this repository
        run: brew tap codecoradev/tap "${{ github.workspace }}"

      - name: Install formula
        run: brew install codecoradev/tap/uteke

      - name: Test formula
        run: brew test --verbose codecoradev/tap/uteke

  test-linux:
    name: brew install + test (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure Homebrew on PATH
        run: |
          BREW_DIR="/home/linuxbrew/.linuxbrew"
          if [ ! -x "$BREW_DIR/bin/brew" ]; then
            sudo mkdir -p "$BREW_DIR" && sudo chown -R "$(whoami)" "$BREW_DIR"
            git clone --depth=1 https://github.com/Homebrew/brew "$BREW_DIR/Homebrew"
            mkdir -p "$BREW_DIR/bin" && ln -sf ../Homebrew/bin/brew "$BREW_DIR/bin/brew"
          fi
          echo "$BREW_DIR/bin" >> "$GITHUB_PATH"

      - name: Update Homebrew
        run: brew update

      - name: Tap this repository
        run: brew tap codecoradev/tap "${{ github.workspace }}"

      - name: Install formula
        run: brew install codecoradev/tap/uteke

      - name: Test formula
        run: brew test --verbose codecoradev/tap/uteke
